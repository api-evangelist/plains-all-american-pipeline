description: >-
  Plains All American Pipeline, L.P. (NASDAQ: PAA) is a Houston-based, Fortune 500 midstream energy company that
  owns and operates pipeline transportation, terminalling, storage and gathering assets for crude oil and natural
  gas liquids across the United States and Canada. Plains publishes no public API, developer portal, SDK or
  machine-readable contract: its only online customer surfaces are the Electronic Nominations (Enom) portal and
  the Shipper Application Portal, both login-gated Salesforce Experience Cloud sites, alongside public tariff
  and crude-oil price-bulletin pages on plains.com. This profile records that absence honestly rather than
  describing an API that does not exist.
